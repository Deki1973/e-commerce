management.endpoint.jmx.exposure.include=*

spring.application.name=ecommerce-backend


spring.datasource.url=jdbc:postgresql://localhost:5432/ecom
#spring.datasource.url=${DATABASE_URL}

spring.datasource.username=postgres
spring.datasource.password=privremena1.
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
#spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=your_super_strong_secret_key
jwt.expiration-time=1

server.port=${PORT:8080}


# Trick to let IntelliJ view endpoints through actuator.
management.endpoints.jmx.exposure.include=*

# Encryption configuration
encryption.salt.rounds=10

# JWT configuration
jwt.algorithm.key=SuperSecureSecretKey
jwt.issuer=eCommerce
jwt.expiryInSeconds=604800

# Email configuration
email.from=no-reply@ecommerce.com

# General configuration
app.frontend.url=http://ecommerce.com

# SMTP configuration
spring.mail.host=localhost
spring.mail.port=25
